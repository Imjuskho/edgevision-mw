<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>EdgeVision Studio — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #3b82f6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: var(--surface);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 32px 24px;
      }
      h1 { font-size: 20px; margin-bottom: 8px; }
      p { color: var(--muted); line-height: 1.5; font-size: 14px; margin-bottom: 20px; }
      button {
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>EdgeVision Studio needs a connection for some tasks. Cached pages and queued saves will sync when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
