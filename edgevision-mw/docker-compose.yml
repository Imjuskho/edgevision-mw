services:
  app:
    build:
      context: .
      args:
        INSTALL_TRAINING_DEPS: "true"
    ports:
      - "8000:8000"
    env_file:
      - .env
    entrypoint: ["/code/entrypoint.sh"]
    volumes:
      - ./frontend/public/models:/code/frontend/public/models:ro
      - ./models/road_seg:/code/models/road_seg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edgevision-net
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      args:
        INSTALL_TRAINING_DEPS: "true"
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    volumes:
      - ./frontend/public/models:/code/frontend/public/models:ro
      - ./models/road_seg:/code/models/road_seg:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - edgevision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  celery_beat:
    build:
      context: .
      args:
        INSTALL_TRAINING_DEPS: "true"
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - edgevision-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "--timeout=5"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgevision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgevision_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edgevision_mw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgevision} -d ${POSTGRES_DB:-edgevision_mw}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edgevision-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-edgevision_redis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-edgevision_redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - edgevision-net
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-03-26T21-24-40Z
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edgevision-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  edgevision-net:
    driver: bridge
